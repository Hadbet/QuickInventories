<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Grammer Quick Inventor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        #video-bg {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -1;
            object-fit: cover;
            filter: blur(4px) brightness(0.6);
        }
        .form-container {
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-900">

<video autoplay muted loop id="video-bg">
    <source src="https://grammermx.com/AleTest/ATS/videos/Video.mp4" type="video/mp4">
    Tu navegador no soporta videos en background.
</video>

<div class="flex items-center justify-center min-h-screen px-4">
    <div class="w-full max-w-md p-8 space-y-8 bg-white/10 backdrop-blur-md rounded-2xl shadow-2xl form-container">
        <div class="text-center">
            <h1 class="text-4xl font-extrabold text-white">Grammer Quick Inventor</h1>
            <p class="mt-2 text-slate-300">Bienvenido, por favor inicia sesión.</p>
        </div>
        <form id="login-form" class="space-y-6">
            <div>
                <label for="username" class="sr-only">Usuario</label>
                <input type="text" id="username" name="username" class="w-full px-5 py-3 text-white bg-white/20 border border-slate-500 rounded-lg placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="Usuario" required>
            </div>
            <div>
                <label for="password" class="sr-only">Contraseña</label>
                <input type="password" id="password" name="password" class="w-full px-5 py-3 text-white bg-white/20 border border-slate-500 rounded-lg placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="w-full bg-orange-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-orange-700 transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-orange-600">
                Iniciar Sesión
            </button>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const loginForm = document.getElementById('login-form');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(loginForm);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('https://grammermx.com/Logistica/QuickInventories/dao/validate_login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const result = await response.json();

                if (result.success) {
                    // Redirigir a la página de inicio si el login es exitoso
                    window.location.href = 'almacen.php';
                } else {
                    Swal.fire({
                        title: 'Error de Acceso',
                        text: result.message,
                        icon: 'error',
                        confirmButtonColor: '#ea580c'
                    });
                }
            } catch (error) {
                Swal.fire({
                    title: 'Error de Conexión',
                    text: 'No se pudo conectar con el servidor. Por favor, intenta de nuevo.',
                    icon: 'error',
                    confirmButtonColor: '#ea580c'
                });
            }
        });
    });
</script>

</body>
</html>
